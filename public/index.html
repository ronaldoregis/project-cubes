<!DOCTYPE html>
<html>
  <head>
    <title>Project Cubes</title>
    <style>
      canvas { border: 1px solid black; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div style="display: flex;">
      <canvas id="game" width="640" height="640"></canvas>
      <div id="monsters-side-bar"></div>
      <div id="playerStatus" style="margin-left: 32px;">
        <div id="level">12</div>
        <div id="xp"></div>
        <div id="maxHp"></div>
        <div id="hp"></div>
        <div id="attack"></div>
        <div id="defense"></div>
      </div>
    </div>
    <div id="log" style="margin-top: 10px; height: 100px; overflow-y: auto; font-family: monospace; background: #222; color: #0f0; padding: 5px;"></div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
  </body>
</html>
